<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platon Games-Прикольні ігри про песиків і котиків!</title>

    <link rel="icon" href="favicon.png" type="image/png">

    <meta name="description" content="Ігри про персонажів:Тіто,Смартик,Джуніор,Філ,Мілка.">
    <meta name="keywords" content="Ігра,Гра,Тіто,Смартик,Джуніор,Філ,Мілка,Котики,Собаки,Прикол.">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap');

        /* Основні стилі */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #240b36, #c31432);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            overflow-x: hidden;
            padding: 20px;
            transition: background 2s ease;
            user-select: none;
        }

        /* Хоррор фон */
        body.glitch-mode {
            background: linear-gradient(135deg, #000000, #2b0000) !important;
        }

        /* --- НОВИЙ ЗОЛОТИЙ ФОН НАЗАВЖДИ --- */
        body.ultimate-gold-mode {
            background: linear-gradient(135deg, #FFD700, #FFA500, #FF8C00) !important;
            animation: goldShine 5s infinite alternate;
        }

        @keyframes goldShine {
            0% { background: linear-gradient(135deg, #FFD700, #FFA500); }
            100% { background: linear-gradient(135deg, #FF8C00, #FFD700); }
        }

        .background-circles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 20s infinite linear;
        }

        .circle:nth-child(1) { width: 300px; height: 300px; left: -50px; top: -50px; }
        .circle:nth-child(2) { width: 500px; height: 500px; right: -100px; bottom: -100px; }
        .circle:nth-child(3) { width: 100px; height: 100px; right: 20%; top: 20%; background: rgba(255, 0, 150, 0.3); }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-100px) rotate(360deg); }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 1s ease-out;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 4rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            background: linear-gradient(to right, #ff00cc, #333399);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0px 10px 20px rgba(0,0,0,0.3);
            position: relative;
        }

        body.ultimate-gold-mode h1 {
            background: linear-gradient(to right, #ffffff, #ffee00);
            -webkit-background-clip: text;
        }
        body.ultimate-gold-mode h1::after {
            background: linear-gradient(to right, #ffffff, #ffee00);
        }

        h1::after {
            content: 'PLATON GAMES';
            position: absolute;
            left: 0; top: 0; width: 100%; height: 100%;
            background: linear-gradient(to right, #ff00cc, #333399);
            -webkit-background-clip: text; background-clip: text;
            color: transparent; z-index: -1; filter: blur(15px); opacity: 0.7;
        }

        /* Глюк заголовок */
        .glitch-mode h1 {
            animation: textGlitch 0.3s infinite;
            background: linear-gradient(to right, #ff0000, #660000);
            -webkit-background-clip: text;
        }

        .games-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            max-width: 1200px;
            width: 100%;
            animation: fadeInUp 1s ease-out 0.5s backwards;
        }

        .game-card {
            position: relative;
            width: 280px;
            height: 400px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
        }

        .game-card img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.5s ease;
        }

        /* Ефект глюків для карток */
        .glitch-active {
            animation: cardGlitch 0.2s infinite;
            filter: grayscale(1) contrast(2) brightness(0.8);
        }

        @keyframes cardGlitch {
            0% { transform: translate(0); }
            20% { transform: translate(-5px, 5px); clip-path: inset(10% 0 30% 0); }
            40% { transform: translate(5px, -5px); clip-path: inset(40% 0 10% 0); }
            60% { transform: translate(-2px, 2px); }
            100% { transform: translate(0); }
        }

        @keyframes textGlitch {
            0% { transform: skew(0deg); }
            20% { transform: skew(10deg); color: red; }
            40% { transform: skew(-10deg); }
            100% { transform: skew(0deg); }
        }

        /* Секретна картка */
        #secret-card {
            display: none;
            border: 2px solid #ff0000;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
            background: black;
        }

        .devilish-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #ff0000;
            font-size: 5rem;
            text-shadow: 0 0 20px red;
        }

        .devilish-text {
            font-size: 1rem;
            margin-top: 10px;
            letter-spacing: 2px;
        }

        /* Інше */
        .play-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); display: flex;
            justify-content: center; align-items: center; opacity: 0;
            transition: opacity 0.3s ease;
        }

        .game-card:hover .play-overlay { opacity: 1; }

        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .game-card { width: 90%; height: 350px; }
        }

        #end-button {
            display: none;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(45deg, #ff00cc, #333399);
            color: white;
            font-size: 2.5rem;
            padding: 10px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 204, 0.5);
            z-index: 1000;
            animation: pulse 2s infinite;
            transition: transform 0.3s ease;
        }

        #end-button:hover {
            transform: translateX(-50%) scale(1.1);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 20px rgba(255, 0, 204, 0.5); }
            50% { box-shadow: 0 0 40px rgba(255, 0, 204, 0.9); }
            100% { box-shadow: 0 0 20px rgba(255, 0, 204, 0.5); }
        }

        #video-container {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        #end-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* --- НОВІ СЕКРЕТИ З КУТАМИ --- */
        .corner-click-zone {
            position: fixed;
            width: 80px;
            height: 80px;
            z-index: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            cursor: crosshair;
        }
        #zone-tl { top: 0; left: 0; }
        #zone-tr { top: 0; right: 0; }
        #zone-bl { bottom: 0; left: 0; }
        #zone-br { bottom: 0; right: 0; }
        
        .corner-check {
            display: none;
            text-shadow: 0 0 15px #00ff00;
            animation: checkPop 0.3s ease-out forwards;
        }

        @keyframes checkPop {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* --- ЕКРАН 100% ПЕРЕМОГИ --- */
        #victory-100-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #ff7b00, #ffdd00);
            z-index: 99999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            animation: fadeInScreen 1s ease-out;
        }

        @keyframes fadeInScreen {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .victory-title {
            font-size: 4rem;
            color: white;
            text-shadow: 0 10px 20px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .upload-container {
            background: rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.5);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }

        .upload-label {
            display: inline-block;
            background: #fff;
            color: #ff7b00;
            padding: 15px 30px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 800;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .upload-label:hover { transform: scale(1.05); }

        #avatar-upload { display: none; }

        .avatar-preview-box {
            width: 150px; height: 150px;
            margin: 20px auto 0;
            border-radius: 50%;
            border: 5px solid white;
            box-shadow: 0 0 20px rgba(255,255,255,0.8);
            overflow: hidden;
            display: none;
            background: #fff;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }
        .avatar-preview-box img {
            width: 100%; height: 100%; object-fit: cover;
        }

        .ok-btn {
            background: #333399;
            color: white;
            font-size: 2rem;
            font-weight: 800;
            padding: 15px 50px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            transition: 0.3s;
            display: none;
        }
        .ok-btn:hover { background: #ff00cc; transform: scale(1.1); }

        /* --- UI НАЙКРАЩОГО ГРАВЦЯ --- */
        #best-player-ui {
            display: none;
        }
        .player-info {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px 10px 10px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 215, 0, 0.5);
            animation: slideInLeft 1s ease-out;
        }

        @keyframes slideInLeft {
            from { transform: translateX(-100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .player-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid #FFD700;
            box-shadow: 0 0 20px 5px rgba(255, 215, 0, 0.8);
            object-fit: cover;
        }
        
        .player-text {
            color: white;
            font-size: 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        /* --- ПЕРЕМИКАЧ СВІТІВ --- */
        .world-toggle-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px 25px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            animation: slideInRight 1s ease-out;
        }

        @keyframes slideInRight {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .world-text {
            color: white;
            font-size: 1rem;
            font-weight: 800;
            margin-bottom: 10px;
            text-transform: uppercase;
            text-shadow: 0 2px 5px black;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 80px;
            height: 34px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333399;
            transition: .4s;
            border-radius: 34px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .slider:before {
            position: absolute;
            content: "🎮";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
        }
        input:checked + .slider { background-color: #ff00cc; }
        input:checked + .slider:before { transform: translateX(46px); content: "🌐"; }

        /* ================= ПАСХАЛЬНЕ ОНОВЛЕННЯ ================= */
        .easter-theme-btn {
            background: linear-gradient(45deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: #d800ff;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 1.5rem;
            padding: 15px 40px;
            border: 4px solid #fff;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px #ff9a9e;
            animation: bounceBtn 2s infinite;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-shadow: 0 2px 5px rgba(255,255,255,0.8);
        }
        @keyframes bounceBtn {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        #brawl-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 999999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }

        .rays {
            position: absolute;
            width: 200vw; height: 200vw;
            background: repeating-conic-gradient(from 0deg, rgba(255, 215, 0, 0.2) 0deg 15deg, transparent 15deg 30deg);
            animation: spin 10s linear infinite;
            z-index: 1;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .brawler-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .brawler-img {
            max-width: 300px;
            max-height: 400px;
            filter: brightness(0) drop-shadow(0 0 10px rgba(0,0,0,0.8));
            transform: scale(0.5);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .brawler-img.silhouette-show {
            transform: scale(1);
            opacity: 1;
        }

        .brawler-img.revealed {
            filter: brightness(1) drop-shadow(0 0 40px #FFD700);
            transform: scale(1.2);
            animation: popReveal 0.5s ease-out;
        }

        @keyframes popReveal {
            0% { transform: scale(1); filter: brightness(10); }
            50% { transform: scale(1.4); }
            100% { transform: scale(1.2); filter: brightness(1) drop-shadow(0 0 40px #FFD700); }
        }

        .brawler-name {
            font-size: 4rem;
            color: #FFD700;
            text-shadow: 0 5px 20px rgba(0,0,0,1);
            margin-top: 30px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            text-transform: uppercase;
        }
        .brawler-name.show {
            opacity: 1;
            transform: translateY(0);
        }

        .click-to-continue {
            position: absolute;
            bottom: 50px;
            font-size: 1.5rem;
            color: white;
            opacity: 0.5;
            animation: blinkText 1s infinite;
            z-index: 2;
            cursor: pointer;
            display: none;
            background: rgba(0,0,0,0.5);
            padding: 10px 30px;
            border-radius: 30px;
            border: 2px solid white;
        }
        @keyframes blinkText { 50% { opacity: 1; } }

        .easter-decor {
            position: fixed;
            font-size: 3rem;
            z-index: -1;
            opacity: 0.6;
            animation: floatEgg 10s infinite linear;
            pointer-events: none;
        }
        @keyframes floatEgg {
            0% { transform: translateY(110vh) rotate(0deg); }
            100% { transform: translateY(-10vh) rotate(360deg); }
        }
        
        .new-game-unlocked {
            font-size: 3rem;
            color: #00ffcc;
            text-shadow: 0 0 20px #00ffcc;
            text-align: center;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.5s ease;
            display: none;
        }
        .new-game-unlocked.show {
            opacity: 1;
            transform: scale(1);
        }

        /* Особлива рамка для великодньої гри */
        .easter-game-glow {
            border: 4px solid #ff9a9e;
            box-shadow: 0 0 40px #ff9a9e;
            animation: easterPulse 2s infinite;
        }
        @keyframes easterPulse {
            0%, 100% { box-shadow: 0 0 20px #ff9a9e; }
            50% { box-shadow: 0 0 50px #d800ff; border-color: #d800ff; }
        }
        /* ======================================================= */
    </style>
</head>

        <div class="game-card game-item">

        <div class="game-card game-item">

                <div class="play-overlay"><span class="play-icon">▶</span></div>

        <div class="game-card game-item">
            <a href="https://platon-lab.github.io/Music-Game/" target="_blank">

        <div class="game-card game-item">
            <a href="https://platon-lab.github.io/Puzzle/" target="_blank">

         <div class="game-card game-item">

         <div class="game-card game-item">

        <div class="game-card game-item">
            <a href="https://platon-lab.github.io/PlatonLingo/" target="_blank">
                <img src="English.png" alt="English Game Poster">
                <div class="play-overlay"><span class="play-icon">▶</span></div>

        <div class="game-card game-item">
            <a href="https://platon-lab.github.io/Fight-Arena/" target="_blank">
                <img src="Arena.png" alt="Arena Game Poster">
                <div class="play-overlay"><span class="play-icon">▶</span></div>

        <div class="game-card game-item">
            <a href="https://platon-lab.github.io/Square-Race/" target="_blank">

                <div class="play-overlay"><span class="play-icon">▶</span></div>

        <div class="game-card" id="secret-card">
            <a href="https://platon-lab.github.io/-/" target="_blank">
                <div class="devilish-content">
                    <span>⛧</span>
                    <div class="devilish-text">НЕ ГРАЙ</div>
                </div>
                <div class="play-overlay"><span class="play-icon">♰</span></div>

        <div class="game-card game-item easter-game-glow" id="easter-game-card" style="display: none;">

    <button id="end-button">▶️</button>

    <div id="video-container">
        <video id="end-video" src="End.mp4"></video>
    </div>

    <div class="corner-click-zone" id="zone-tl"><span class="corner-check">✅</span></div>
    <div class="corner-click-zone" id="zone-tr"><span class="corner-check">✅</span></div>
    <div class="corner-click-zone" id="zone-bl"><span class="corner-check">✅</span></div>
    <div class="corner-click-zone" id="zone-br"><span class="corner-check">✅</span></div>

    <div id="victory-100-screen">
        <h2 class="victory-title">ВИ ПРОЙШЛИ ГРУ НА 100%</h2>
        <div class="upload-container">
            <label for="avatar-upload" class="upload-label">ОБРАТИ АВАТАРКУ З ГАЛЕРЕЇ</label>
            <input type="file" id="avatar-upload" accept="image/*">
            <div class="avatar-preview-box" id="avatar-preview-box">
                <img id="avatar-preview" src="" alt="Avatar">
            </div>
        </div>
        <button class="ok-btn" id="victory-ok-btn">ОК</button>
    </div>

    <div id="best-player-ui">
        <div class="player-info">
            <img src="" alt="Best Player" class="player-avatar" id="ui-avatar">
            <span class="player-text">НАЙКРАЩИЙ ГРАВЕЦЬ!</span>
        </div>
        <div class="world-toggle-container">
            <div class="world-text" id="world-text">ОБРАНО Platon Games</div>
            <label class="switch">
                <input type="checkbox" id="world-toggle">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div style="width:100%;display:flex;justify-content:center;margin:40px 0 20px;">
        <a href="https://platon-lab.github.io/Review/" target="_blank" style="display:inline-block;background:linear-gradient(45deg,#ff00cc,#333399);color:white;font-family:'Montserrat',sans-serif;font-weight:800;font-size:1.5rem;padding:18px 50px;border-radius:50px;text-decoration:none;box-shadow:0 10px 30px rgba(255,0,204,0.4);transition:transform 0.3s ease,box-shadow 0.3s ease;" onmouseover="this.style.transform='scale(1.08)';this.style.boxShadow='0 15px 40px rgba(255,0,204,0.7)'" onmouseout="this.style.transform='scale(1)';this.style.boxShadow='0 10px 30px rgba(255,0,204,0.4)'">✍️ Написати відгук</a>
    </div>

    <div id="brawl-overlay">
        <div class="rays"></div>
        <div class="brawler-container">
            <img id="brawler-img" class="brawler-img" src="" alt="Brawler">
            <div id="brawler-name" class="brawler-name"></div>
            <div id="new-game-msg" class="new-game-unlocked">
                🎉 НОВЕ ОНОВЛЕННЯ РОЗБЛОКОВАНО! 🎉<br><br>
                <img src="Egg.png" style="width:200px; border-radius:30px; box-shadow:0 0 40px #fff; border:5px solid #fff;"><br><br>
                EASTER GAME
            </div>
        </div>
        <div id="brawl-continue" class="click-to-continue">Натисни, щоб продовжити</div>
    </div>

    <script>
        // --- ЛОГІКА ДЕКОРАЦІЙ ПАСХИ ---
        const easterEmojis = ['🥚', '🐰', '🌸', '🐣', '🌷', '🎀'];
        for(let i=0; i<15; i++) {
            let egg = document.createElement('div');
            egg.className = 'easter-decor';
            egg.innerText = easterEmojis[Math.floor(Math.random() * easterEmojis.length)];
            egg.style.left = Math.random() * 100 + 'vw';
            egg.style.animationDuration = (Math.random() * 10 + 8) + 's';
            egg.style.animationDelay = Math.random() * 5 + 's';
            document.body.appendChild(egg);
        }

        // --- ЛОГІКА АНІМАЦІЇ НОВИХ БІЙЦІВ ---
        const brawlers = [
            { name: "Яйціто", img: "Tito.png" },
            { name: "Паскмартик", img: "Smartik.png" },
            { name: "Ковбасуніор", img: "Junior.png" },
            { name: "Хрінфіл", img: "Fil.png" },
            { name: "Салмілка", img: "Milka.png" },
            { name: "Холобарк", img: "Bark.png" }
        ];

        let currentBrawler = 0;
        let brawlerState = 0; // 0 = not started, 1 = silhouette, 2 = revealed, 3 = game unlocked
        const brawlOverlay = document.getElementById('brawl-overlay');
        const bImg = document.getElementById('brawler-img');
        const bName = document.getElementById('brawler-name');
        const bContinue = document.getElementById('brawl-continue');
        const nMsg = document.getElementById('new-game-msg');

        document.getElementById('easter-prize-btn').addEventListener('click', (e) => {
            e.stopPropagation(); // ЗАХИСТ ВІД ХОРРОР-РЕЖИМУ!
            document.getElementById('easter-prize-btn').style.display = 'none'; 
            brawlOverlay.style.display = 'flex';
            currentBrawler = 0;
            nMsg.classList.remove('show');
            nMsg.style.display = 'none';
            bImg.style.display = 'block';
            bName.style.display = 'block';
            showBrawler();
        });

        function showBrawler() {
            if (currentBrawler >= brawlers.length) {
                // Показуємо екран нової гри
                bImg.style.display = 'none';
                bName.style.display = 'none';
                nMsg.style.display = 'block';
                setTimeout(() => nMsg.classList.add('show'), 100);
                bContinue.style.display = 'block';
                bContinue.innerText = "ОК";
                brawlerState = 3;
                return;
            }

            brawlerState = 1;
            const b = brawlers[currentBrawler];
            bImg.src = b.img;
            bImg.className = 'brawler-img'; // Скидання класів
            bName.className = 'brawler-name'; // Скидання класів
            bName.innerText = b.name;
            bContinue.style.display = 'none';

            // Показуємо силует
            setTimeout(() => {
                bImg.classList.add('silhouette-show');
            }, 100);

            // Авто-розкриття через 1.5 секунди (якщо гравець не клікнув раніше)
            setTimeout(() => {
                if(brawlerState === 1) revealBrawler();
            }, 1500);
        }

        function revealBrawler() {
            brawlerState = 2;
            bImg.classList.add('revealed');
            bName.classList.add('show');
            setTimeout(() => {
                bContinue.style.display = 'block';
                bContinue.innerText = "Натисни, щоб продовжити";
            }, 500);
        }

        brawlOverlay.addEventListener('click', (e) => {
            e.stopPropagation(); // ЗАХИСТ ВІД ХОРРОР-РЕЖИМУ!
            if (brawlerState === 1) {
                revealBrawler(); // Пропуск очікування силуету
            } else if (brawlerState === 2) {
                brawlerState = 0;
                currentBrawler++;
                showBrawler();
            } else if (brawlerState === 3) {
                // Фінал - закриваємо оверлей і показуємо нову гру
                brawlOverlay.style.display = 'none';
                document.getElementById('easter-game-card').style.display = 'block';
                
                // Плавно прокручуємо вниз сторінки, щоб гравець одразу побачив нову гру
                window.scrollTo({
                    top: document.body.scrollHeight,
                    behavior: 'smooth'
                });
            }
        });


        // --- СТАРА ЛОГІКА (БЕЗ ЗМІН) ---

        let emptySpaceClicks = 0;
        let horrorModeActivated = false;
        let secretClickedFirst = false;
        let hasWonOnce = false; 
        let glitchDisabledForever = false; 

        // --- ЛОГІКА СЕКРЕТНИХ КУТІВ ---
        const cornerClicks = { tl: 0, tr: 0, bl: 0, br: 0 };
        const cornersDone = { tl: false, tr: false, bl: false, br: false };
        let ultimateVictoryAchieved = false;
        let savedAvatarBase64 = "";

        // Перевіряємо локальне сховище під час завантаження
        window.addEventListener('load', () => {
            if (localStorage.getItem('platon100Percent') === 'true') {
                activateUltimateGoldMode(localStorage.getItem('platonAvatarData'));
            }
        });

        document.querySelectorAll('.corner-click-zone').forEach(zone => {
            zone.addEventListener('click', (e) => {
                e.stopPropagation(); 
                if (ultimateVictoryAchieved || localStorage.getItem('platon100Percent') === 'true') return;

                const zoneId = zone.id.replace('zone-', '');
                if (cornersDone[zoneId]) return;

                cornerClicks[zoneId]++;
                console.log(`Кут ${zoneId}: ${cornerClicks[zoneId]}/20`);

                if (cornerClicks[zoneId] >= 20) {
                    cornersDone[zoneId] = true;
                    zone.querySelector('.corner-check').style.display = 'block';
                    checkUltimateVictory();
                }
            });
        });

        function checkUltimateVictory() {
            if (cornersDone.tl && cornersDone.tr && cornersDone.bl && cornersDone.br) {
                ultimateVictoryAchieved = true;
                document.getElementById('victory-100-screen').style.display = 'flex';
            }
        }

        // Завантаження аватарки з галереї та зміна розміру 
        document.getElementById('avatar-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = 150;
                        canvas.height = 150;
                        ctx.drawImage(img, 0, 0, 150, 150);
                        
                        savedAvatarBase64 = canvas.toDataURL('image/png');
                        
                        document.getElementById('avatar-preview').src = savedAvatarBase64;
                        document.getElementById('avatar-preview-box').style.display = 'flex';
                        document.getElementById('victory-ok-btn').style.display = 'inline-block';
                    }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('victory-ok-btn').addEventListener('click', () => {
            localStorage.setItem('platon100Percent', 'true');
            if (savedAvatarBase64) {
                localStorage.setItem('platonAvatarData', savedAvatarBase64);
            }
            document.getElementById('victory-100-screen').style.display = 'none';
            activateUltimateGoldMode(savedAvatarBase64);
        });

        function activateUltimateGoldMode(avatarData) {
            ultimateVictoryAchieved = true;
            document.body.classList.add('ultimate-gold-mode');
            
            document.querySelectorAll('.corner-click-zone').forEach(z => z.style.display = 'none');

            document.getElementById('best-player-ui').style.display = 'block';
            
            const uiAvatar = document.getElementById('ui-avatar');
            if (avatarData) {
                uiAvatar.src = avatarData;
            } else {
                uiAvatar.style.background = '#fff';
            }
        }

        const worldToggle = document.getElementById('world-toggle');
        const worldText = document.getElementById('world-text');

        worldToggle.addEventListener('change', () => {
            if (worldToggle.checked) {
                worldText.innerText = 'ОБРАНО Platon Games ALL';
                setTimeout(() => {
                    window.location.href = 'https://platon-lab.github.io/PLATON-GAMES-ALL/';
                }, 500); 
            } else {
                worldText.innerText = 'ОБРАНО Platon Games';
            }
        });

        document.addEventListener('click', (event) => {
            if (horrorModeActivated || glitchDisabledForever || ultimateVictoryAchieved || localStorage.getItem('platon100Percent') === 'true') return; 

            const clickedOnCard = event.target.closest('.game-card');
            const clickedOnEndButton = event.target.closest('#end-button');
            const clickedOnOverlay = event.target.closest('#brawl-overlay');
            const clickedOnEasterBtn = event.target.closest('#easter-prize-btn');

            if (!clickedOnCard && !clickedOnEndButton && !clickedOnOverlay && !clickedOnEasterBtn) {
                emptySpaceClicks++;
                console.log(`Clicks: ${emptySpaceClicks}`);

                if (emptySpaceClicks >= 20) {
                    if (hasWonOnce) {
                        window.open('https://platon-lab.github.io/Glitch-Again/', '_blank');
                        emptySpaceClicks = 0; 
                        glitchDisabledForever = true; 
                        document.getElementById('end-button').style.display = 'block'; 
                        return;
                    }
                    activateHorrorMode();
                }
            }
        });

        document.querySelectorAll('.game-card').forEach(card => {
            card.addEventListener('click', (e) => {
                // Додаємо виняток для нової великодньої гри, щоб вона не відкривала хоррор-ігри
                if (card.id === 'easter-game-card') return; 

                if (!horrorModeActivated) return;

                if (card.id === 'secret-card') {
                    secretClickedFirst = true;
                    return; 
                }

                e.preventDefault();
                
                if (secretClickedFirst) {
                    hasWonOnce = true; 
                    window.open('https://platon-lab.github.io/Glitch-WIN-game/', '_blank');
                    disableHorrorMode();
                } else {
                    window.open('https://platon-lab.github.io/Glitch-Game/', '_blank');
                }
            });
        });

        function activateHorrorMode() {
            horrorModeActivated = true;
            document.body.classList.add('glitch-mode');
            
            const cards = document.querySelectorAll('.game-item');
            cards.forEach(card => {
                if(card.id !== 'easter-game-card') {
                    card.classList.add('glitch-active');
                }
            });

            const secretCard = document.getElementById('secret-card');
            secretCard.style.display = 'block';

            document.getElementById('main-title').innerText = 'P L A T O N  6 6 6';
            console.log("System failure...");
        }

        function disableHorrorMode() {
            horrorModeActivated = false;
            secretClickedFirst = false;
            emptySpaceClicks = 0;
            
            document.body.classList.remove('glitch-mode');
            
            const cards = document.querySelectorAll('.game-item');
            cards.forEach(card => {
                card.classList.remove('glitch-active');
            });

            const secretCard = document.getElementById('secret-card');
            secretCard.style.display = 'none';

            document.getElementById('main-title').innerText = 'Platon Games';
            console.log("System restored.");
        }

        document.getElementById('end-button').addEventListener('click', () => {
            const videoContainer = document.getElementById('video-container');
            const video = document.getElementById('end-video');
            
            videoContainer.style.display = 'flex';
            
            if (videoContainer.requestFullscreen) {
                videoContainer.requestFullscreen();
            } else if (videoContainer.webkitRequestFullscreen) {
                videoContainer.webkitRequestFullscreen();
            } else if (videoContainer.msRequestFullscreen) {
                videoContainer.msRequestFullscreen();
            }

            video.play();
        });

        document.getElementById('end-video').addEventListener('ended', () => {
            window.location.href = 'https://platon-lab.github.io/PLATON-GAMES-2/';
        });
    </script>
</body>
</html>
